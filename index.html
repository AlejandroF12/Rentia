<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rentia</title>
    <script>
      try {
        const preferences = JSON.parse(localStorage.getItem('rentia.preferences.v1') || '{}');
        document.documentElement.dataset.theme = preferences.darkMode === true ? 'dark' : 'light';
        document.documentElement.dataset.reduceMotion = preferences.reduceMotion === true ? 'true' : 'false';
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.reduceMotion = 'false';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
