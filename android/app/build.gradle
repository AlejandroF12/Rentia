apply plugin: 'com.android.application'

def releaseSigningFile = new File(System.getProperty('user.home'), '.rentia/rentia-signing.properties')
def releaseSigningProperties = new java.util.Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { stream -> releaseSigningProperties.load(stream) }
}

def signingPropertyKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = signingPropertyKeys.every { key ->
    releaseSigningProperties.getProperty(key)?.trim()
}
def hasPartialReleaseSigning = signingPropertyKeys.any { key ->
    releaseSigningProperties.getProperty(key)?.trim()
} && !releaseSigningConfigured

if (hasPartialReleaseSigning) {
    throw new GradleException("Incomplete Android release signing configuration in ${releaseSigningFile}")
}

def releaseArtifactRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    normalizedTaskName.contains('assemblerelease') || normalizedTaskName.contains('bundlerelease')
}
if (releaseArtifactRequested && !releaseSigningConfigured) {
    throw new GradleException("Android release signing is not configured. See the 'Distribuir una versión Android firmada' section in README.md.")
}
if (releaseSigningConfigured && !new File(releaseSigningProperties.getProperty('storeFile')).isFile()) {
    throw new GradleException("Android release keystore not found: ${releaseSigningProperties.getProperty('storeFile')}")
}

android {
    namespace = "me.rentiaapp.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "me.rentiaapp.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'packageRelease' || task.name == 'bundleRelease') {
        doFirst {
            if (!releaseSigningConfigured) {
                throw new GradleException("Android release signing is not configured. See the 'Distribuir una versión Android firmada' section in README.md.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
